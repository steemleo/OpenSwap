name: Release

# Fires when a GitHub Release is published — NOT on a bare tag push. Tagging a
# commit and deciding to ship it to npm are different acts, and only the second
# should be able to put code on users' machines. `workflow_dispatch` is the
# manual escape hatch.
#
# Auth has two phases, and this workflow handles both:
#
#   First publish — trusted publishing CANNOT create a package. The trusted
#                   publisher is configured on a package's own settings page,
#                   which does not exist until the package does; npm surfaces
#                   that as a misleading 404/ENEEDAUTH (npm/cli#9088) — as this
#                   repo's own first two Release runs demonstrated. So v0.1.0
#                   goes out with a short-lived granular token. Provenance does
#                   NOT require OIDC: those same failed runs signed a valid
#                   Sigstore statement before auth was ever checked.
#   After that    — configure the trusted publisher, delete the NPM_TOKEN
#                   secret, and this workflow switches to OIDC by itself.
#                   Revoke the token the same day.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; the job escalates only what it needs.
permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false # never cancel a half-finished publish

jobs:
  publish:
    runs-on: ubuntu-latest # cloud-hosted runner required; self-hosted is not eligible
    environment: release # manual approval gate before anything reaches the registry
    permissions:
      contents: read
      id-token: write # Sigstore provenance — required in BOTH auth modes
    steps:
      - uses: actions/checkout@v4
        with:
          # Publish the exact commit the Release points at, not whatever main
          # has drifted to since.
          ref: ${{ github.event.release.tag_name || github.ref }}
          # Don't leave a usable GITHUB_TOKEN in .git/config for later steps —
          # nothing here pushes, so persisting it is pure attack surface.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs npm >= 11.5.1 and the failure mode is a
      # misleading ENEEDAUTH, not a version error. Pin it explicitly so a
      # runner image change cannot silently downgrade us back into that.
      - name: Use an npm that supports trusted publishing
        run: |
          npm i -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      - run: npm ci

      # A mislabelled build of a CLI that moves user funds cannot be taken back
      # once published. Fail before the registry ever sees it.
      - name: Version guards
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          SRC="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/VERSION\s*=\s*\"([^\"]+)\"/)[1]")"
          echo "package.json=$PKG  src/version.ts=$SRC  release_tag=${RELEASE_TAG:-<none>}"
          # The CLI's own --version must match what the registry will serve.
          [ "$SRC" = "$PKG" ] || { echo "::error::src/version.ts ($SRC) != package.json ($PKG)"; exit 1; }
          # On a Release the tag is authoritative. workflow_dispatch has no tag,
          # so only the internal consistency check above applies.
          if [ -n "$RELEASE_TAG" ]; then
            [ "${RELEASE_TAG#v}" = "$PKG" ] || { echo "::error::release tag ($RELEASE_TAG) != package.json ($PKG)"; exit 1; }
          fi

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
          node scripts/e2e-sim.mjs

      # Record exactly what shipped — the release log is the audit trail when
      # someone asks what a given version contained.
      - name: Show tarball contents
        run: npm pack --dry-run

      # Setting NODE_AUTH_TOKEN at all makes npm use it, so the presence of the
      # secret is the switch between the two modes.
      - name: Determine auth mode
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Publishing with a granular token (+ explicit --provenance)."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Publishing via trusted publishing (provenance is automatic)."
          fi

      - name: Publish (granular token — first release only)
        if: steps.auth.outputs.mode == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (trusted publishing)
        if: steps.auth.outputs.mode == 'oidc'
        run: npm publish --access public

      # Provenance is the supply-chain evidence a careful user checks before
      # running `npx` against a tool that touches their wallet. A missing
      # attestation should be visible, not quietly shipped.
      - name: Confirm provenance was attached
        run: |
          sleep 15
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" dist.attestations --json 2>/dev/null | grep -q provenance; then
            echo "provenance attached to $PKG@$VER"
          else
            echo "::warning::no provenance attestation found for $PKG@$VER"
          fi
