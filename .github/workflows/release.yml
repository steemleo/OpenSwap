name: Release

# Publishes on a version tag. Handles BOTH phases of the npm auth story:
#
#   First publish — trusted publishing cannot be configured for a package that
#                   does not exist yet (the setting lives on the package's own
#                   settings page), so v0.1.0 goes out with a short-lived
#                   granular token. Provenance does NOT require OIDC: a token
#                   plus `id-token: write` and an explicit `--provenance`
#                   produces the same Sigstore attestations.
#   After that    — configure the trusted publisher on npmjs.com, delete the
#                   NPM_TOKEN secret, and this workflow switches itself to OIDC
#                   automatically (see "Determine auth mode"). Revoke the token
#                   the same day.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Sigstore provenance — required in BOTH auth modes

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # cloud-hosted runner required; self-hosted is not eligible
    environment: release # lets you require a manual approval before any publish
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave a usable GITHUB_TOKEN in .git/config for later steps —
          # nothing here pushes, so persisting it is pure attack surface.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # setup-node's Node 22 ships npm 10.9, which cannot do OIDC. Trusted
      # publishing needs >= 11.5.1, and the failure mode is a misleading
      # ENEEDAUTH rather than a version error — so pin it explicitly.
      - name: Use an npm that supports trusted publishing
        run: |
          npm i -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      - run: npm ci

      # A mislabelled build of a CLI that moves user funds is not recoverable
      # once published. Fail before the registry ever sees it.
      - name: Version guards
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SRC="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/VERSION\s*=\s*\"([^\"]+)\"/)[1]")"
          echo "tag=$TAG  package.json=$PKG  src/version.ts=$SRC"
          [ "$TAG" = "$PKG" ] || { echo "::error::git tag ($TAG) != package.json ($PKG)"; exit 1; }
          [ "$SRC" = "$PKG" ] || { echo "::error::src/version.ts ($SRC) != package.json ($PKG)"; exit 1; }

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
          node scripts/e2e-sim.mjs

      # Record exactly what is in the tarball — the release log is the audit
      # trail when someone asks what a given version shipped.
      - name: Show tarball contents
        run: npm pack --dry-run

      # Setting NODE_AUTH_TOKEN at all makes npm use it, so the presence of the
      # secret is the switch between the two modes.
      - name: Determine auth mode
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Publishing with a granular token (+ explicit --provenance)."
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Publishing via trusted publishing (provenance is automatic)."
          fi

      - name: Publish (granular token — first release only)
        if: steps.auth.outputs.mode == 'token'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish (trusted publishing)
        if: steps.auth.outputs.mode == 'oidc'
        run: npm publish --access public

      # Provenance is the supply-chain evidence a careful user checks before
      # running `npx` against a tool that touches their wallet. A missing
      # attestation should be visible, not quietly shipped.
      - name: Confirm provenance was attached
        run: |
          sleep 15
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" dist.attestations --json 2>/dev/null | grep -q provenance; then
            echo "provenance attached to $PKG@$VER"
          else
            echo "::warning::no provenance attestation found for $PKG@$VER"
          fi
